  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    overscroll-behavior: contain;
    padding-right: 6px;
    scrollbar-gutter: stable;
  }
  #korea-trip-board .day-row {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    transition: box-shadow 260ms ease, background-color 260ms ease;
  }
  #korea-trip-board .day-row.is-map-selected {
    box-shadow: inset 3px 0 var(--phase-color);
    background: color-mix(in srgb, var(--phase-color) 7%, transparent);
  }
  #korea-trip-board .day-row:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }
  #korea-trip-board .day-top {
    display: grid;
    grid-template-columns: 54px minmax(0, 1fr);
    gap: 10px;
  }
  #korea-trip-board .day-date {
    color: var(--muted-foreground);
    font-variant-numeric: tabular-nums;
  }
  #korea-trip-board .day-plan {
    margin: 0;
  }
  #korea-trip-board .day-note {
    margin: 4px 0 0;
    color: var(--muted-foreground);
  }
  #korea-trip-board .day-row-actions {
    margin: 8px 0 0 64px;
  }
  #korea-trip-board details {
    margin: 8px 0 0 64px;
  }
  #korea-trip-board summary {
    color: var(--foreground);
    cursor: pointer;
  }
  #korea-trip-board .day-summary-copy {
    margin: 8px 0 2px;
    max-width: 72ch;
    color: var(--muted-foreground);
  }
  #korea-trip-board .day-map-actions,
  #korea-trip-board .stop-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  #korea-trip-board .day-route-note {
    margin: 7px 0 0;
    color: var(--muted-foreground);
  }
  #korea-trip-board .stop-list {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
  }
  #korea-trip-board .stop-row {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr);
    gap: 12px;
    padding: 10px 0;
    align-items: stretch;
  }
  #korea-trip-board .stop-row:first-child {
    margin-top: 4px;
  }
  #korea-trip-board .stop-node {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  #korea-trip-board .stop-connector {
    position: absolute;
    top: 28px;
    bottom: -20px;
    left: 50%;
    border-left: 2px dotted color-mix(in srgb, var(--viz-series-1) 58%, var(--border));
    transform: translateX(-1px);
  }
  #korea-trip-board .stop-title {
    margin: 1px 0 0;
  }
  #korea-trip-board .stop-actions {
    margin-top: 6px;
  }
  @media (max-width: 760px) {
    html,
    body {
      height: auto;
      overflow: auto;
    }
    #korea-trip-board {
      height: auto;
      min-height: 0;
      overflow: visible;
    }
    #korea-trip-board .board-layout {
      grid-template-columns: 1fr;
    }
    #korea-trip-board.itinerary-collapsed .board-layout {
      grid-template-columns: 1fr;
    }
    #korea-trip-board .map-zone,
    #korea-trip-board .detail-panel {
      height: auto;
      overflow: visible;
    }
    #korea-trip-board .trip-map {
      height: 430px;
      flex: none;
    }
    #korea-trip-board .detail-content {
      height: auto;
      overflow: visible;
    }
    #korea-trip-board .itinerary-list {
      max-height: 60vh;
    }
  }
  @media (max-width: 430px) {
    #korea-trip-board .trip-map {
      height: 360px;
    }
    #korea-trip-board .detail-panel {
      padding: 14px;
    }
    #korea-trip-board .detail-heading {
      flex-direction: column;
    }
    #korea-trip-board .day-top {
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 8px;
    }
    #korea-trip-board details {
      margin-left: 0;
    }
    #korea-trip-board .day-row-actions {
      margin-left: 0;
    }
    #korea-trip-board .map-zoom-controls {
      width: 100%;
    }
    #korea-trip-board .map-zoom-controls .btn {
      flex: 1 1 80px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #korea-trip-board * {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  function distanceKm(a, b) {
    const radius = 6371;
    const toRad = (value) =&gt; value * Math.PI / 180;

    const lat1 = toRad(a[1]);

    const value = Math.sin(dLat / 2) ** 2

  function stopBounds(stops, crossCountry) {
    const longitudes = stops.map((stop) =&gt; stop.coord[0]);
    const latitudes = stops.map((stop) =&gt; stop.coord[1]);
    let minLng = Math.min(...longitudes);
    let maxLng = Math.max(...longitudes);
    let minLat = Math.min(...latitudes);
    let maxLat = Math.max(...latitudes);
    const minimumLngSpan = crossCountry ? 1.2 : 0.035;
    const minimumLatSpan = crossCountry ? 1.2 : 0.028;
    const lngSpan = Math.max(maxLng - minLng, minimumLngSpan);
    const latSpan = Math.max(maxLat - minLat, minimumLatSpan);
    const centerLng = (minLng + maxLng) / 2;
    const centerLat = (minLat + maxLat) / 2;
    minLng = centerLng - lngSpan * 0.68;
    maxLng = centerLng + lngSpan * 0.68;
    minLat = centerLat - latSpan * 0.68;
    maxLat = centerLat + latSpan * 0.68;
    return { minLng, maxLng, minLat, maxLat };
  }

  function stopFrame(stops, crossCountry) {
    const { minLng, maxLng, minLat, maxLat } = stopBounds(stops, crossCountry);
    return {
      type: &quot;Feature&quot;,
      properties: {},
      geometry: {
        type: &quot;Polygon&quot;,
        coordinates: [[
          [minLng, minLat],
          [minLng, maxLat],
          [maxLng, maxLat],
          [maxLng, minLat],
          [minLng, minLat]
        ]]
      }
    };
  }

  function worldPixel(coord, zoom) {
    const size = 256 * (2 ** zoom);
    const lng = coord[0];
    const lat = Math.max(-85.05112878, Math.min(85.05112878, coord[1]));
    const sin = Math.sin(lat * Math.PI / 180);
    return [
      (lng + 180) / 360 * size,
      (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * size
    ];
  }

  function tileMapContext(stops, width, height, crossCountry) {
    const bounds = stopBounds(stops, crossCountry);
    const usableWidth = Math.max(210, width - 108);
    const usableHeight = Math.max(220, height - 120);
    let zoom = 15;
    for (; zoom &gt; 5; zoom -= 1) {
      const northwest = worldPixel([bounds.minLng, bounds.maxLat], zoom);
      const southeast = worldPixel([bounds.maxLng, bounds.minLat], zoom);
      if (
        southeast[0] - northwest[0] &lt;= usableWidth
        &amp;&amp; southeast[1] - northwest[1] &lt;= usableHeight
      ) break;
    }
    const northwest = worldPixel([bounds.minLng, bounds.maxLat], zoom);
    const southeast = worldPixel([bounds.maxLng, bounds.minLat], zoom);
    const center = [
      (northwest[0] + southeast[0]) / 2,
      (northwest[1] + southeast[1]) / 2
    ];
    const size = 256 * (2 ** zoom);
    const offsetX = width / 2 - center[0];
    const offsetY = (height - 18) / 2 - center[1];
    return {
      zoom,
      offsetX,
      offsetY,
      projection: geoMercator()
        .scale(size / (2 * Math.PI))
        .translate([offsetX + size / 2, offsetY + size / 2])
    };
  }

  function drawMapTiles(width, height, context) {
    const tileLayer = root.querySelector(&quot;.tile-layer&quot;);
    const { zoom, offsetX, offsetY } = context;
    const tileCount = 2 ** zoom;
    const minTileX = Math.floor(-offsetX / 256) - 1;
    const maxTileX = Math.floor((width - offsetX) / 256) + 1;
    const minTileY = Math.max(0, Math.floor(-offsetY / 256) - 1);
    const maxTileY = Math.min(tileCount - 1, Math.floor((height - offsetY) / 256) + 1);
    for (let tileY = minTileY; tileY &lt;= maxTileY; tileY += 1) {
      for (let tileX = minTileX; tileX &lt;= maxTileX; tileX += 1) {
        const wrappedX = ((tileX % tileCount) + tileCount) % tileCount;
        tileLayer.append(el(&quot;image&quot;, {
          href: `https://tile.openstreetmap.org/${zoom}/${wrappedX}/${tileY}.png`,
          x: tileX * 256 + offsetX,
          y: tileY * 256 + offsetY,
          width: 256,
          height: 256,
          class: &quot;map-tile&quot;,
          &quot;aria-hidden&quot;: &quot;true&quot;
        }));
      }
    }
  }

  function routeSegments(points, inset = 22) {
    return points.slice(0, -1).map((from, index) =&gt; {
      const to = points[index + 1];
      const dx = to[0] - from[0];
      const dy = to[1] - from[1];
      const distance = Math.hypot(dx, dy);
      if (distance &lt;= 6) return &quot;&quot;;
      const ux = dx / distance;
      const uy = dy / distance;
      const segmentInset = Math.min(inset, Math.max(0, distance / 2 - 3));
      const start = [from[0] + ux * segmentInset, from[1] + uy * segmentInset];
      const end = [to[0] - ux * segmentInset, to[1] - uy * segmentInset];
      return `M${start[0]},${start[1]}L${end[0]},${end[1]}`;
    }).filter(Boolean).join(&quot; &quot;);
  }

  function drawDistrictBasemap(projection, path, width, height, phase, crossCountry) {
    const basemapLayer = root.querySelector(&quot;.basemap-layer&quot;);
    const contextLayer = root.querySelector(&quot;.context-layer&quot;);
    if (crossCountry) {
      return;
    }
    const boundaries = adminBoundaries[boundaryKey(phase)];
    boundaries.features.forEach((district) =&gt; {
      const districtPath = path(district);
      if (!districtPath) return;
      basemapLayer.append(el(&quot;path&quot;, { d: districtPath, class: &quot;district&quot; }));
      const [[left, top], [right, bottom]] = path.bounds(district);
      const [x, y] = path.centroid(district);
      if (
        right - left &gt; 58
        &amp;&amp; bottom - top &gt; 28
        &amp;&amp; x &gt; 30 &amp;&amp; x &lt; width - 30
        &amp;&amp; y &gt; 26 &amp;&amp; y &lt; height - 55
      ) {
        const label = el(&quot;text&quot;, { x, y, class: &quot;district-label&quot; });
        label.textContent = district.properties.title;
        contextLayer.append(label);
      }
    });
  }

  function landmarkLayouts(stops, projection, width, height) {
    const layouts = stops.map((stop, index) =&gt; {
      const [x, y] = projection(stop.coord);
      return {
        stop,
        index,
        x,
        y,
        side: index % 2 === 0 ? &quot;right&quot; : &quot;left&quot;,
        boxWidth: Math.min(160, Math.max(80, stop.label.length * 6.3 + 18))
      };
    });

    [&quot;left&quot;, &quot;right&quot;].forEach((side) =&gt; {
      const sideLayouts = layouts
        .filter((layout) =&gt; layout.side === side)
        .sort((a, b) =&gt; a.y - b.y);
      let nextLabelY = 34;
      sideLayouts.forEach((layout) =&gt; {
        layout.labelY = Math.max(layout.y, nextLabelY);
        nextLabelY = layout.labelY + 38;
      });
      if (!sideLayouts.length) return;
      const overflow = sideLayouts.at(-1).labelY - (height - 82);
      if (overflow &gt; 0) sideLayouts.forEach((layout) =&gt; { layout.labelY -= overflow; });
      const underflow = 34 - sideLayouts[0].labelY;
      if (underflow &gt; 0) sideLayouts.forEach((layout) =&gt; { layout.labelY += underflow; });
    });

    layouts.forEach((layout) =&gt; {
      if (layout.side === &quot;right&quot;) {
        layout.boxX = Math.min(
          width - layout.boxWidth - 14,
          Math.max(width * 0.57, layout.x + 26)
        );
        layout.leaderX = layout.boxX;
      } else {
        layout.boxX = Math.max(
          14,
          Math.min(width * 0.43 - layout.boxWidth, layout.x - layout.boxWidth - 26)
        );
        layout.leaderX = layout.boxX + layout.boxWidth;
      }
    });
    return layouts;
  }

  function drawLandmark(layout, animate) {

    const pinGroup = el(&quot;g&quot;);

    labelLink.append(labelGroup);
    landmarkLayer.append(leader, pinLink, labelLink);

    if (animate &amp;&amp; !reducedMotion) {
      [pinGroup, labelGroup].forEach((group) =&gt; group.animate(
        [
          { transform: &quot;translateY(16px)&quot;, opacity: 0 },
          { transform: &quot;translateY(0)&quot;, opacity: 1 }
        ],
        {
          duration: 430,
          delay: index * 80,
          easing: &quot;cubic-bezier(.2,.8,.2,1)&quot;,
          fill: &quot;both&quot;
        }
      ));
    }
  }

  function drawDayMap(width, height, animate) {
    const phase = phases[selected];
    const day = phase.days[selectedDayIndex] || phase.days[0];
    const stops = mappedStops(day);
    if (!stops.length) {
      root.querySelector(&quot;.map-status&quot;).textContent = `${phase.city} · ${day.date} · No mapped stops yet`;
      return;
    }
    const longitudes = stops.map((stop) =&gt; stop.coord[0]);
    const latitudes = stops.map((stop) =&gt; stop.coord[1]);
    const crossCountry = Math.max(...longitudes) - Math.min(...longitudes) &gt; 1.2
      || Math.max(...latitudes) - Math.min(...latitudes) &gt; 1.2;
    const mapContext = tileMapContext(stops, width, height, crossCountry);
    const projection = mapContext.projection;
    const path = geoPath(projection);
    drawMapTiles(width, height, mapContext);
    drawDistrictBasemap(projection, path, width, height, phase, crossCountry);

    if (stops.length &gt;= 2) {
      const points = stops.map((stop) =&gt; projection(stop.coord));
      const routeD = routeSegments(points);
      if (routeD) {
        const shadow = el(&quot;path&quot;, { d: routeD, class: &quot;day-route-shadow&quot; });
        const route = el(&quot;path&quot;, { d: routeD, class: &quot;day-route&quot; });
        root.querySelector(&quot;.route-layer&quot;).append(shadow, route);
        if (animate &amp;&amp; !reducedMotion) {
          const total = route.getTotalLength();
          route.style.strokeDasharray = `${total} ${total}`;
          route.style.strokeDashoffset = `${total}`;
          const routeAnimation = route.animate(
            [{ strokeDashoffset: total }, { strokeDashoffset: 0 }],
            { duration: 850, easing: &quot;cubic-bezier(.2,.8,.2,1)&quot; }
          );
          routeAnimation.addEventListener(&quot;finish&quot;, () =&gt; {
            route.style.strokeDasharray = &quot;none&quot;;
            route.style.strokeDashoffset = &quot;0&quot;;
          }, { once: true });
        }
      }
    }
    landmarkLayouts(stops, projection, width, height).forEach((layout) =&gt; drawLandmark(layout, animate));
    root.querySelector(&quot;.map-status&quot;).textContent = `${phase.city} · ${day.date} · ${stops.length} mapped stop${stops.length === 1 ? &quot;&quot; : &quot;s&quot;} · pinch or scroll to zoom · drag to move`;
  }

  function drawMap(animate = true) {
    const { width, height } = mapDimensions();
    setPhaseColor();
    clearMap();
    if (mapMode === &quot;day&quot;) {
      drawDayMap(width, height, animate);
    } else {
      drawOverview(width, height, animate);
    }
    updateMapControls();
  }

  function updateOverviewRoute(animate = true) {
    const progress = root.querySelector(&quot;.route-progress&quot;);
    const plane = root.querySelector(&quot;.plane&quot;);
    if (!progress || !plane) return;
    const total = Number(progress.dataset.total || progress.getTotalLength());
    const phase = phases[selected];
    const fraction = (phase.order - 1) / 3;
    const visible = Math.max(0, total * fraction);
    progress.style.strokeDasharray = `${visible} ${Math.max(0, total - visible)}`;
    progress.style.strokeDashoffset = &quot;0&quot;;
    const point = progress.getPointAtLength(visible);
    const next = progress.getPointAtLength(Math.min(total, visible + 2));
    const angle = Math.atan2(next.y - point.y, next.x - point.x) * 180 / Math.PI;
    plane.setAttribute(&quot;transform&quot;, `translate(${point.x},${point.y}) rotate(${angle})`);
    plane.style.display = phase.order === 1 ? &quot;none&quot; : &quot;&quot;;

    if (animate &amp;&amp; !reducedMotion &amp;&amp; phase.order &gt; 1) {
      const from = Math.max(0, visible - total / 3);
      progress.animate(
        [
          { strokeDasharray: `${from} ${total - from}` },
          { strokeDasharray: `${visible} ${total - visible}` }
        ],
        { duration: 700, easing: &quot;cubic-bezier(.2,.8,.2,1)&quot; }
      );
      const motionPath = `path(&quot;${progress.getAttribute(&quot;d&quot;)}&quot;)`;
      plane.style.offsetPath = motionPath;
      plane.style.offsetRotate = &quot;auto&quot;;
      plane.style.transform = &quot;none&quot;;
      plane.animate(
        [{ offsetDistance: `${Math.max(0, fraction - 1 / 3) * 100}%` }, { offsetDistance: `${fraction * 100}%` }],
        { duration: 700, easing: &quot;cubic-bezier(.2,.8,.2,1)&quot;, fill: &quot;forwards&quot; }
      ).onfinish = () =&gt; {
        plane.style.offsetPath = &quot;&quot;;
        plane.style.offsetRotate = &quot;&quot;;
        plane.style.transform = &quot;&quot;;
        plane.setAttribute(&quot;transform&quot;, `translate(${point.x},${point.y}) rotate(${angle})`);
      };
    }
  }

  function renderDetail() {
    const phase = phases[selected];
    root.querySelector(&quot;.phase-number&quot;).textContent = `Stage ${phase.order} of 4`;
    root.querySelector(&quot;.phase-title&quot;).textContent = phase.city;
    root.querySelector(&quot;.phase-subtitle&quot;).textContent = phase.dates;
    root.querySelector(&quot;.hotel-area&quot;).textContent = phase.base;
    root.querySelector(&quot;.day-count&quot;).textContent = `${phase.days.length} planned days`;
    root.querySelector(&quot;.city-map&quot;).href = `https://map.naver.com/p/search/${encodeURIComponent(`${phase.city} attractions`)}`;

    const list = root.querySelector(&quot;.itinerary-list&quot;);
    list.replaceChildren();
    phase.days.forEach((day, dayIndex) =&gt; {
      const row = document.createElement(&quot;article&quot;);
      row.className = &quot;day-row&quot;;
      row.dataset.dayIndex = String(dayIndex);
      if (mapMode === &quot;day&quot; &amp;&amp; selectedDayIndex === dayIndex) {
        row.classList.add(&quot;is-map-selected&quot;);
      }
      const top = document.createElement(&quot;div&quot;);
      top.className = &quot;day-top&quot;;
      const date = document.createElement(&quot;strong&quot;);
      date.className = &quot;day-date text-small&quot;;
      date.textContent = day.date;
      const body = document.createElement(&quot;div&quot;);
      const plan = document.createElement(&quot;p&quot;);
      plan.className = &quot;day-plan&quot;;
      plan.textContent = day.plan;
      const note = document.createElement(&quot;p&quot;);
      note.className = &quot;day-note text-small&quot;;
      note.textContent = day.note;
      body.append(plan, note);
      top.append(date, body);

      const dayActions = document.createElement(&quot;div&quot;);
      dayActions.className = &quot;viz-row day-row-actions&quot;;
      const showOnMap = document.createElement(&quot;button&quot;);
      showOnMap.type = &quot;button&quot;;
      showOnMap.className = &quot;btn&quot;;
      showOnMap.setAttribute(&quot;aria-pressed&quot;, String(mapMode === &quot;day&quot; &amp;&amp; selectedDayIndex === dayIndex));
      showOnMap.innerHTML = &#x27;&lt;i data-lucide=&quot;map&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Show on map&#x27;;
      showOnMap.addEventListener(&quot;click&quot;, () =&gt; selectDay(dayIndex));
      dayActions.append(showOnMap);

      const summaryDetails = document.createElement(&quot;details&quot;);
      summaryDetails.className = &quot;summary-details&quot;;
      const summaryToggle = document.createElement(&quot;summary&quot;);
      summaryToggle.textContent = &quot;Day summary&quot;;
      const summaryCopy = document.createElement(&quot;p&quot;);
      summaryCopy.className = &quot;day-summary-copy&quot;;
      summaryCopy.textContent = day.summary;
      summaryDetails.append(summaryToggle, summaryCopy);

      const details = document.createElement(&quot;details&quot;);
      const summary = document.createElement(&quot;summary&quot;);
      summary.textContent = &quot;Explore this day&quot;;
      details.addEventListener(&quot;toggle&quot;, () =&gt; {
        if (details.open) selectDay(dayIndex);
      });
      const mapActions = document.createElement(&quot;div&quot;);
      mapActions.className = &quot;day-map-actions&quot;;
      const routeNote = document.createElement(&quot;p&quot;);
      routeNote.className = &quot;day-route-note text-small&quot;;
      const physicalStops = mappedStops(day);

      if (physicalStops.length &gt;= 2) {
        const modes = physicalStops.slice(0, -1).map((stop, index) =&gt;
          legMode(stop, physicalStops[index + 1], phase)
        );
        const overviewMode = physicalStops.length === 2
          ? modes[0]
          : modes.every((mode) =&gt; mode === &quot;walk&quot;) ? &quot;walk&quot; : &quot;car&quot;;
        const overview = document.createElement(&quot;a&quot;);
        overview.className = &quot;btn btn-primary&quot;;
        overview.href = naverRouteUrl(physicalStops, overviewMode);
        overview.target = &quot;_blank&quot;;
        overview.rel = &quot;noopener noreferrer&quot;;
        overview.innerHTML = &#x27;&lt;i data-lucide=&quot;map&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Full day in Naver Maps&#x27;;
        mapActions.append(overview);
        routeNote.textContent = overviewMode === &quot;car&quot;
          ? phase.city === &quot;Jeju&quot;
            ? &quot;The overview and longer legs use Naver’s driving view; short nearby legs may still be shown as walks.&quot;
            : &quot;The multi-stop overview uses Naver’s car/taxi view. Individual legs below use walking, transit, or taxi routes.&quot;
          : &quot;The full-day view follows the stops in the itinerary order.&quot;;
      } else {
        routeNote.textContent = &quot;This day has fewer than two confirmed map stops, so no route is shown yet.&quot;;
      }

      const stopList = document.createElement(&quot;ol&quot;);
      stopList.className = &quot;stop-list&quot;;
      day.items.forEach((item, index) =&gt; {
        const stopRow = document.createElement(&quot;li&quot;);
        stopRow.className = &quot;stop-row&quot;;
        const stopNode = document.createElement(&quot;div&quot;);
        stopNode.className = &quot;stop-node&quot;;
        const stopNumber = document.createElement(&quot;span&quot;);
        stopNumber.className = &quot;viz-badge&quot;;
        stopNumber.textContent = String(index + 1);
        stopNode.append(stopNumber);
        if (index &lt; day.items.length - 1) {
          const connector = document.createElement(&quot;span&quot;);
          connector.className = &quot;stop-connector&quot;;
          connector.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          stopNode.append(connector);
        }
        const stopBody = document.createElement(&quot;div&quot;);
        const stopTitle = document.createElement(&quot;p&quot;);
        stopTitle.className = &quot;stop-title&quot;;
        stopTitle.textContent = `${landmarkIcon(item)} ${item}`;
        stopBody.append(stopTitle);

        const place = places[item];
        if (place?.coord) {
          const stopActions = document.createElement(&quot;div&quot;);
          stopActions.className = &quot;stop-actions&quot;;
          const placeLink = document.createElement(&quot;a&quot;);
          placeLink.className = &quot;btn btn-ghost&quot;;
          placeLink.href = naverSearchUrl(item, phase);
          placeLink.target = &quot;_blank&quot;;
          placeLink.rel = &quot;noopener noreferrer&quot;;
          placeLink.innerHTML = &#x27;&lt;i data-lucide=&quot;map-pin&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Open place&#x27;;
          stopActions.append(placeLink);

          const nextItem = day.items.slice(index + 1).find((candidate) =&gt; places[candidate]?.coord);
          if (nextItem) {
            const from = { label: item, ...place };
            const to = { label: nextItem, ...places[nextItem] };
            const mode = legMode(from, to, phase);
            const legLink = document.createElement(&quot;a&quot;);
            legLink.className = &quot;btn&quot;;
            legLink.href = naverRouteUrl([from, to], mode);
            legLink.target = &quot;_blank&quot;;
            legLink.rel = &quot;noopener noreferrer&quot;;
            legLink.innerHTML = `&lt;i data-lucide=&quot;route&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; ${modeLabel(mode)} to ${nextItem}`;
            stopActions.append(legLink);
          }
          stopBody.append(stopActions);
        }
        stopRow.append(stopNode, stopBody);
        stopList.append(stopRow);
      });
      details.append(summary, mapActions, routeNote, stopList);
      row.append(top, dayActions, summaryDetails, details);
      list.append(row);
    });
    renderHotel(phase);
    if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
  }

  function highlightSelectedDay() {
    root.querySelectorAll(&quot;.day-row&quot;).forEach((row) =&gt; {
      const active = mapMode === &quot;day&quot; &amp;&amp; Number(row.dataset.dayIndex) === selectedDayIndex;
      row.classList.toggle(&quot;is-map-selected&quot;, active);
      const button = row.querySelector(&quot;.day-row-actions .btn&quot;);
      if (button) button.setAttribute(&quot;aria-pressed&quot;, String(active));
    });
  }

  function selectDay(dayIndex) {
    const phase = phases[selected];
    if (!phase.days[dayIndex]) return;
    selectedDayIndex = dayIndex;
    mapMode = &quot;day&quot;;
    resetMapViewImmediately();
    highlightSelectedDay();
    drawMap(true);
  }

  function selectPhase(key) {
    if (!phases[key]) return;
    selected = key;
    selectedDayIndex = 0;
    mapMode = &quot;overview&quot;;
    resetMapViewImmediately();
    root.querySelectorAll(&quot;.phase-btn&quot;).forEach((button) =&gt; {
      button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.phase === key));
    });
    renderDetail();
    drawMap(true);
  }

  root.querySelectorAll(&quot;.phase-btn&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; selectPhase(button.dataset.phase));
  });

  root.querySelectorAll(&quot;.map-mode-btn&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      mapMode = button.dataset.mapMode;
      resetMapViewImmediately();
      highlightSelectedDay();
      drawMap(true);
    });
  });
  root.querySelector(&quot;.zoom-out&quot;).addEventListener(&quot;click&quot;, () =&gt; setMapZoom(targetMapZoom / 1.35));
  root.querySelector(&quot;.reset-zoom&quot;).addEventListener(&quot;click&quot;, resetMapView);
  root.querySelector(&quot;.zoom-in&quot;).addEventListener(&quot;click&quot;, () =&gt; setMapZoom(targetMapZoom * 1.35));

  const itineraryPanelToggle = root.querySelector(&quot;.itinerary-panel-toggle&quot;);
  itineraryPanelToggle.addEventListener(&quot;click&quot;, () =&gt; {
    const collapsed = root.classList.toggle(&quot;itinerary-collapsed&quot;);
    itineraryPanelToggle.setAttribute(&quot;aria-expanded&quot;, String(!collapsed));
    itineraryPanelToggle.setAttribute(
      &quot;aria-label&quot;,
      collapsed ? &quot;Expand itinerary panel&quot; : &quot;Collapse itinerary panel&quot;
    );
    root.querySelector(&quot;.itinerary-panel-arrow&quot;).textContent = collapsed ? &quot;←&quot; : &quot;→&quot;;
  });

  svg.addEventListener(&quot;wheel&quot;, (event) =&gt; {
    event.preventDefault();
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 160 : 1;
    const delta = event.deltaY * unit;
    const sensitivity = event.ctrlKey ? 0.009 : 0.00135;
    const factor = Math.max(0.82, Math.min(1.22, Math.exp(-delta * sensitivity)));
    setMapZoom(targetMapZoom * factor, clientToMapPoint(event.clientX, event.clientY));
  }, { passive: false });

  function beginMapDrag(pointerId, point, timeStamp) {
    dragState = {
      pointerId,
      startX: point.x,
      startY: point.y,
      panX: mapPan.x,
      panY: mapPan.y,
      lastX: point.x,
      lastY: point.y,
      lastTime: timeStamp,
      velocityX: 0,
      velocityY: 0,
      moved: false
    };
    svg.classList.add(&quot;is-dragging&quot;);
  }

  function touchPinchMetrics() {
    const points = Array.from(activeTouchPointers.values()).slice(0, 2);
    if (points.length &lt; 2) return null;
    return {
      center: {
        x: (points[0].x + points[1].x) / 2,
        y: (points[0].y + points[1].y) / 2
      },
      distance: Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y)
    };
  }

  function beginMapPinch() {
    const metrics = touchPinchMetrics();
    if (!metrics || metrics.distance &lt; 1) return;
    stopMapMotion();
    dragState = null;
    svg.classList.remove(&quot;is-dragging&quot;);
    const width = svg.viewBox.baseVal.width || mapDimensions().width;
    const height = svg.viewBox.baseVal.height || mapDimensions().height;
    pinchState = {
      startDistance: metrics.distance,
      startZoom: mapZoom,
      worldOffsetX: (metrics.center.x - width / 2 - mapPan.x) / mapZoom,
      worldOffsetY: (metrics.center.y - height / 2 - mapPan.y) / mapZoom
    };
  }

  svg.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      const point = clientToMapPoint(event.clientX, event.clientY);
      activeTouchPointers.set(event.pointerId, point);
      svg.setPointerCapture(event.pointerId);
      event.preventDefault();
      stopMapMotion();
      if (activeTouchPointers.size === 1) {
        beginMapDrag(event.pointerId, point, event.timeStamp);
      } else if (activeTouchPointers.size === 2) {
        beginMapPinch();
      }
      return;
    }
    if (event.button !== 0 || !event.isPrimary || event.target.closest(&quot;a&quot;)) return;
    stopMapMotion();
    const startPoint = clientToMapPoint(event.clientX, event.clientY);
    beginMapDrag(event.pointerId, startPoint, event.timeStamp);
    svg.setPointerCapture(event.pointerId);
  });

  svg.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
    if (activeTouchPointers.has(event.pointerId)) {
      const point = clientToMapPoint(event.clientX, event.clientY);
      activeTouchPointers.set(event.pointerId, point);
      if (pinchState &amp;&amp; activeTouchPointers.size &gt;= 2) {
        const metrics = touchPinchMetrics();
        if (!metrics) return;
        const width = svg.viewBox.baseVal.width || mapDimensions().width;
        const height = svg.viewBox.baseVal.height || mapDimensions().height;
        const nextZoom = Math.min(
          3.4,
          Math.max(0.75, pinchState.startZoom * metrics.distance / pinchState.startDistance)
        );
        mapZoom = nextZoom;
        mapPan = {
          x: metrics.center.x - width / 2 - nextZoom * pinchState.worldOffsetX,
          y: metrics.center.y - height / 2 - nextZoom * pinchState.worldOffsetY
        };
        targetMapZoom = mapZoom;
        targetMapPan = { ...mapPan };
        suppressMapClick = true;
        updateMapButtons();
        scheduleMapTransform();
        return;
      }
    }
    if (!dragState || event.pointerId !== dragState.pointerId) return;
    const currentPoint = clientToMapPoint(event.clientX, event.clientY);
    const dx = currentPoint.x - dragState.startX;
    const dy = currentPoint.y - dragState.startY;
    if (Math.hypot(dx, dy) &gt; 4) dragState.moved = true;
    mapPan = { x: dragState.panX + dx, y: dragState.panY + dy };
    targetMapPan = { ...mapPan };
    const elapsed = Math.max(1, event.timeStamp - dragState.lastTime);
    const instantVelocityX = (currentPoint.x - dragState.lastX) / elapsed;
    const instantVelocityY = (currentPoint.y - dragState.lastY) / elapsed;
    dragState.velocityX = dragState.velocityX * 0.64 + instantVelocityX * 0.36;
    dragState.velocityY = dragState.velocityY * 0.64 + instantVelocityY * 0.36;
    dragState.lastX = currentPoint.x;
    dragState.lastY = currentPoint.y;
    dragState.lastTime = event.timeStamp;
    updateMapButtons();
    scheduleMapTransform();
  });

  function startMapInertia(velocityX, velocityY) {
    const initialSpeed = Math.hypot(velocityX, velocityY);
    if (reducedMotion || initialSpeed &lt; 0.02) return;
    const maximumSpeed = 0.72;
    if (initialSpeed &gt; maximumSpeed) {
      const scale = maximumSpeed / initialSpeed;
      velocityX *= scale;
      velocityY *= scale;
    }
    cancelMapInertia();
    let previousTime = performance.now();
    const step = (time) =&gt; {
      const elapsed = Math.min(32, Math.max(1, time - previousTime));
      previousTime = time;
      mapPan = {
        x: mapPan.x + velocityX * elapsed,
        y: mapPan.y + velocityY * elapsed
      };
      targetMapPan = { ...mapPan };
      const decay = Math.pow(0.86, elapsed / 16.67);
      velocityX *= decay;
      velocityY *= decay;
      renderMapTransform();
      updateMapButtons();
      if (Math.hypot(velocityX, velocityY) &gt;= 0.018) {
        inertiaFrame = requestAnimationFrame(step);
      } else {
        inertiaFrame = 0;
      }
    };
    inertiaFrame = requestAnimationFrame(step);
  }

  function finishMapDrag(event) {
    if (!dragState || event.pointerId !== dragState.pointerId) return;
    suppressMapClick = dragState.moved;
    const { moved, velocityX, velocityY } = dragState;
    dragState = null;
    svg.classList.remove(&quot;is-dragging&quot;);
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    if (moved) startMapInertia(velocityX, velocityY);
    setTimeout(() =&gt; { suppressMapClick = false; }, 0);
  }

  function finishMapPointer(event) {
    if (activeTouchPointers.has(event.pointerId)) {
      const wasPinching = Boolean(pinchState);
      activeTouchPointers.delete(event.pointerId);
      if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
      if (wasPinching) {
        pinchState = null;
        targetMapZoom = mapZoom;
        targetMapPan = { ...mapPan };
        if (activeTouchPointers.size === 1) {
          const [remainingId, remainingPoint] = activeTouchPointers.entries().next().value;
          beginMapDrag(remainingId, remainingPoint, event.timeStamp);
        } else {
          dragState = null;
          svg.classList.remove(&quot;is-dragging&quot;);
        }
        suppressMapClick = true;
        setTimeout(() =&gt; { suppressMapClick = false; }, 0);
        return;
      }
    }
    finishMapDrag(event);
  }

  svg.addEventListener(&quot;pointerup&quot;, finishMapPointer);
  svg.addEventListener(&quot;pointercancel&quot;, finishMapPointer);
  svg.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (!suppressMapClick) return;
    event.preventDefault();
    event.stopPropagation();
  }, true);

  function commitHotelLink() {
    const phase = phases[selected];
    const input = root.querySelector(&quot;#hotel-url&quot;);
    const error = root.querySelector(&quot;.hotel-error&quot;);
    try {
      const parsed = new URL(input.value.trim());
      if (![&quot;http:&quot;, &quot;https:&quot;].includes(parsed.protocol)) throw new Error(&quot;bad protocol&quot;);
      hotels[phase.hotelKey] = parsed.href;
      if (!saveHotels()) {
        error.textContent = &quot;This browser blocked local saving. The link will last only until the view closes.&quot;;
      }
      renderHotel(phase);
    } catch (_) {
      error.textContent = &quot;Paste a complete link beginning with http:// or https://&quot;;
    }
  }

  root.querySelector(&quot;.save-hotel&quot;).addEventListener(&quot;click&quot;, commitHotelLink);
  root.querySelector(&quot;#hotel-url&quot;).addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if (event.key === &quot;Enter&quot;) commitHotelLink();
  });

  root.querySelector(&quot;.cancel-hotel&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    root.querySelector(&quot;.hotel-editor&quot;).hidden = true;
    root.querySelector(&quot;.hotel-error&quot;).textContent = &quot;&quot;;
  });

  let resizeTimer;
  const observer = new ResizeObserver(() =&gt; {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() =&gt; drawMap(false), 100);
  });
  observer.observe(root.querySelector(&quot;.map-zone&quot;));

  renderDetail();
  drawMap();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
