    const step = (time) => {
      const elapsed = Math.min(32, time - previous);
      previous = time;
      mapPan = { x: mapPan.x + vx * elapsed, y: mapPan.y + vy * elapsed };
      targetMapPan = { ...mapPan };
      const decay = Math.pow(.86, elapsed / 16.67);
      vx *= decay;
      vy *= decay;
      renderMapTransform();
      if (Math.hypot(vx, vy) >= .018) inertiaFrame = requestAnimationFrame(step); else inertiaFrame = 0;
    };
    inertiaFrame = requestAnimationFrame(step);
  }
  function endPointer(event) {
    if (activeTouchPointers.has(event.pointerId)) {
      const wasPinching = Boolean(pinchState);
      activeTouchPointers.delete(event.pointerId);
      if (wasPinching) {
        pinchState = null;
        if (activeTouchPointers.size === 1) {
          const [id, point] = activeTouchPointers.entries().next().value;
          beginDrag(id, point, event.timeStamp);
        } else {
          dragState = null;
          svg.classList.remove("is-dragging");
        }
        suppressMapClick = true;
        setTimeout(() => { suppressMapClick = false; }, 0);
        return;
      }
    }
    if (!dragState || dragState.pointerId !== event.pointerId) return;
    const { moved, vx, vy } = dragState;
    dragState = null;
    svg.classList.remove("is-dragging");
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    suppressMapClick = moved;
    if (moved) inertia(vx, vy);
    setTimeout(() => { suppressMapClick = false; }, 0);
  }
  svg.addEventListener("pointerup", endPointer);
  svg.addEventListener("pointercancel", endPointer);
  svg.addEventListener("click", (event) => { if (suppressMapClick) { event.preventDefault(); event.stopPropagation(); } }, true);

  window.addEventListener("resize", () => { resetView(true); drawMap(); });
  renderDetail();
  drawMap();
})();
</script>
